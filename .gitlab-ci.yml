# Pipeline for SecureShare.
#   validate: Terraform formatting and syntax
#   test:     Django test suite against a real PostgreSQL
# Phase 5 adds: security scanning, image build, plan/apply with manual approval.

stages:
  - validate
  - test

variables:
  TF_IN_AUTOMATION: "true"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Only run for branch pushes and merge requests.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

terraform-validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.17
    entrypoint: [""]
  script:
    - terraform fmt -check -recursive infra/
    - cd infra/bootstrap
    - terraform init -backend=false -input=false
    - terraform validate
  rules:
    - changes:
        - infra/**/*
        - .gitlab-ci.yml

django-test:
  stage: test
  image: python:3.12-slim
  # A throwaway PostgreSQL for this job, so tests run on the same engine
  # as production rather than SQLite.
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: secureshare
    POSTGRES_USER: secureshare
    POSTGRES_PASSWORD: ci-password-not-a-secret
    DATABASE_URL: "postgres://secureshare:ci-password-not-a-secret@postgres:5432/secureshare"
    DJANGO_DEBUG: "true"
    DJANGO_SECRET_KEY: ci-only-key-not-for-production
  cache:
    key:
      files:
        - app/requirements.txt
    paths:
      - .cache/pip
  before_script:
    - cd app
    - pip install -r requirements.txt
  script:
    - python manage.py test documents -v 2
  rules:
    - changes:
        - app/**/*
        - .gitlab-ci.yml
