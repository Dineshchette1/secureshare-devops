services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secureshare
      POSTGRES_USER: secureshare
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureshare"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: dev-compose-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,.app.github.dev
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,https://*.app.github.dev
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DATABASE_URL: postgres://secureshare:devpassword@db:5432/secureshare
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -"

volumes:
  pgdata:
  media:
