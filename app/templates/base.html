<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SecureShare{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto;
           padding: 0 1rem; line-height: 1.5; }
    header { border-bottom: 1px solid #8884; padding-bottom: .75rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.4rem; margin: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: .5rem .4rem; border-bottom: 1px solid #8883; }
    form { display: grid; gap: .6rem; max-width: 28rem; }
    input, button { padding: .5rem; font: inherit; }
    button { cursor: pointer; }
    .muted { color: #7a7a7a; font-size: .9rem; }
    .expired { color: #b00020; }
    .errors { color: #b00020; font-size: .9rem; }
    code { background: #8882; padding: .15rem .35rem; border-radius: 3px; word-break: break-all; }
  </style>
</head>
<body>
  <header><h1>SecureShare</h1></header>
  {% block content %}{% endblock %}
</body>
</html>
